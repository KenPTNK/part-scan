name: keep-awake
# Streamlit Community Cloud puts apps to sleep after ~12h without visitors.
# A real browser visit every 6h keeps the app warm (a plain curl does not count as a visit).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write # only for the re-enable step below
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Visit the app and wait until it has loaded
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          URL = "https://part-scan-kenptnk.streamlit.app/"
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(URL, timeout=120_000)
              # The sleep page draws its button with JS after load, so checking once right after
              # goto() misses it. Poll: click the button when it appears, finish when the app's
              # own title (contains "PART") shows up.
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              clicked = False
              deadline = time.time() + 480
              while time.time() < deadline:
                  if "PART" in page.title():
                      print("app is up:", page.title())
                      break
                  if not clicked and wake.count():
                      print("app was asleep, waking it")
                      wake.click()
                      clicked = True
                  page.wait_for_timeout(2_000)
              else:
                  raise SystemExit(f"app did not load in 8 min (clicked wake: {clicked}, title: {page.title()!r})")
          PY
      # GitHub disables scheduled workflows after 60 days without repo activity; this keeps it on.
      - name: Keep this schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
